<script>
  // It leaves once the first screen is drawn (init() calls bootDone), never
  // sooner than 600 ms into the page so it does not flicker, and if starting
  // up fails it steps aside so the error message is not hidden behind it.
  // In the iPhone and Android apps the launch screen stays on top until then
  // (the SplashScreen plugin, native/capacitor.config.json), since the web
  // view paints nothing while it loads. It goes in the same frame this one
  // starts to fade, and the two look the same, so the hand-over is unseen.
  (function () {
    var boot = document.getElementById('boot'), gone = false;
    window.bootDone = function () {
      if (gone || !boot) return;
      gone = true;
      var wait = Math.max(0, 600 - (window.performance && performance.now ? performance.now() : 0));
      setTimeout(function () {
        var left = false;
        function leave() {
          if (left) return;
          left = true;
          try {
            var sp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
            if (sp) sp.hide({ fadeOutDuration: 0 });
          } catch (e) {}
          boot.classList.add('boot-out');
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 450);
        }
        // On the next frame, so the first screen is painted underneath. A
        // page that is drawing no frames (a background tab, a web view behind
        // the launch screen) gets no frame, so it goes after 100 ms regardless.
        requestAnimationFrame(leave);
        setTimeout(leave, 100);
      }, wait);
    };
    window.addEventListener('error', function (e) { if (e && e.message) window.bootDone(); });
    window.addEventListener('unhandledrejection', function () { window.bootDone(); });
  })();
</script>

<script>
  // No service worker inside the native (Capacitor) app — assets are bundled locally
  if ('serviceWorker' in navigator && !window.Capacitor) {
    // Old caches are the service worker's to clear, when a new version
    // activates (service-worker.js). This page used to delete every cache but
    // one by a name it had hard-coded, which went stale a release later: from
    // then on each load threw away the offline copy the app had just saved.
    navigator.serviceWorker.register('/service-worker.js').then(reg => {
      reg.update();
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
  }
</script>
