<!--
  Supabase: Authentication > Emails > Templates > reauthentication.
  Subject: Your Arete confirmation code
  Sent only while "Secure password change" is on (off).
-->
<div style="margin:0;padding:40px 20px;background:#0B0B0B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#F8F8F8">
  <div style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 32px;font-size:13px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:#8A8580">Arete</p>
    <h1 style="margin:0 0 16px;font-size:30px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;color:#F8F8F8">Confirm it's you<span style="color:#FF561E">.</span></h1>
    <p style="margin:0 0 12px;font-size:16px;line-height:1.5;color:#B8B3AD">Enter this code in Arete to continue:</p>
    <p style="margin:0 0 32px;font-size:40px;line-height:1;font-weight:800;letter-spacing:0.12em;color:#F8F8F8">{{ .Token }}</p>
    <p style="margin:4px 0 0;font-size:13px;line-height:1.5;color:#8A8580">The code works once. If you didn't ask for it, ignore this email.</p>
  </div>
</div>
