<!--
  Supabase: Authentication > Emails > Templates > email-address-changed.
  Subject: Your Arete email was changed
  A security notice. Switched off in Supabase; styled so it is ready if it is switched on.
-->
<div style="margin:0;padding:40px 20px;background:#0B0B0B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#F8F8F8">
  <div style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 32px;font-size:13px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:#8A8580">Arete</p>
    <h1 style="margin:0 0 16px;font-size:30px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;color:#F8F8F8">Your email was changed<span style="color:#FF561E">.</span></h1>
    <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#B8B3AD">The email for your Arete account was changed from {{ .OldEmail }} to {{ .Email }}.</p>
    <p style="margin:0 0 28px;font-size:16px;line-height:1.5;color:#B8B3AD">If that wasn't you, get in touch through get-arete.com straight away.</p>
    <a href="{{ .SiteURL }}" style="display:inline-block;padding:14px 26px;border-radius:12px;background:#FF561E;color:#0B0B0B;font-size:16px;font-weight:700;text-decoration:none">Open get-arete.com</a>
  </div>
</div>
