<!--
  Supabase: Authentication > Emails > Templates > Reset password.
  Subject: Your Arete reset code
  The app asks for the code ({{ .Token }}, 8 digits, valid for an hour), so it
  has to be in the email: inside the iPhone app the link would open Safari.
  The button is for people who asked on the website.
-->
<div style="margin:0;padding:40px 20px;background:#0B0B0B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#F8F8F8">
  <div style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 32px;font-size:13px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:#8A8580">Arete</p>
    <h1 style="margin:0 0 16px;font-size:30px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;color:#F8F8F8">Reset your password<span style="color:#FF561E">.</span></h1>
    <p style="margin:0 0 12px;font-size:16px;line-height:1.5;color:#B8B3AD">Enter this code in Arete:</p>
    <p style="margin:0 0 32px;font-size:40px;line-height:1;font-weight:800;letter-spacing:0.12em;color:#F8F8F8">{{ .Token }}</p>
    <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#B8B3AD">Or set a new password in your browser:</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;border-radius:12px;background:#FF561E;color:#0B0B0B;font-size:16px;font-weight:700;text-decoration:none">Set a new password</a>
    <p style="margin:36px 0 0;font-size:13px;line-height:1.5;color:#8A8580">The code and the button work once, for one hour. If you didn't ask to reset your password, ignore this email and nothing changes.</p>
  </div>
</div>
