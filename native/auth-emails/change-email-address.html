<!--
  Supabase: Authentication > Emails > Templates > change-email-address.
  Subject: Confirm your new email for Arete
  The app has no email change yet. With "Secure email change" on, both the old and the new address get this.
-->
<div style="margin:0;padding:40px 20px;background:#0B0B0B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#F8F8F8">
  <div style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 32px;font-size:13px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:#8A8580">Arete</p>
    <h1 style="margin:0 0 16px;font-size:30px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;color:#F8F8F8">Confirm your new email<span style="color:#FF561E">.</span></h1>
    <p style="margin:0 0 28px;font-size:16px;line-height:1.5;color:#B8B3AD">Tap the button to change the email on your Arete account from {{ .Email }} to {{ .NewEmail }}.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;border-radius:12px;background:#FF561E;color:#0B0B0B;font-size:16px;font-weight:700;text-decoration:none">Confirm the change</a>
    <p style="margin:36px 0 0;font-size:13px;line-height:1.5;color:#8A8580">If you didn't ask for this, ignore this email and nothing changes.</p>
  </div>
</div>
