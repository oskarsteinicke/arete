<!--
  Supabase: Authentication > Emails > Templates > confirm-sign-up.
  Subject: Confirm your email for Arete
  Sent only while "Confirm email" is on (off since launch). The link lands on get-arete.com, which signs the person in.
-->
<div style="margin:0;padding:40px 20px;background:#0B0B0B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#F8F8F8">
  <div style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 32px;font-size:13px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:#8A8580">Arete</p>
    <h1 style="margin:0 0 16px;font-size:30px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;color:#F8F8F8">Confirm your email<span style="color:#FF561E">.</span></h1>
    <p style="margin:0 0 28px;font-size:16px;line-height:1.5;color:#B8B3AD">Tap the button to confirm this address and finish setting up your Arete account.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;border-radius:12px;background:#FF561E;color:#0B0B0B;font-size:16px;font-weight:700;text-decoration:none">Confirm email</a>
    <p style="margin:36px 0 0;font-size:13px;line-height:1.5;color:#8A8580">If you didn't sign up for Arete, ignore this email.</p>
  </div>
</div>
